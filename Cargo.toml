[workspace]
resolver = "2"
members = [
    "crates/accent-core",
    "crates/accent-storage",
    "crates/accent-mermaid",
    "crates/accent-export",
    "crates/accent-session",
    "crates/accent-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ropey = "1.6"
comrak = { version = "0.35", default-features = false }
fontdb = "0.23"
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
