name: Release Packages (Arch Linux & Windows 11)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-archlinux:
    name: Arch Linux Package (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git rust cargo gtk3 libxkbcommon-x11 wayland
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch Linux package
        run: |
          chown -R builder:builder .
          su builder -c "./packaging/arch/build-arch-pkg.sh"

      - name: Upload Arch Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: accent-archlinux-pkg
          path: packaging/arch/*.pkg.tar.zst

  package-windows11:
    name: Windows 11 User-Level Installer (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows 11 User-Level Packages
        shell: pwsh
        run: |
          ./packaging/windows/build-windows-pkg.ps1

      - name: Upload Windows 11 Packages
        uses: actions/upload-artifact@v4
        with:
          name: accent-windows11-user-installer
          path: |
            packaging/windows/dist/*.exe
            packaging/windows/dist/*.zip
