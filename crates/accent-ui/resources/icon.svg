<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <!-- Filter for GNOME HIG app icon drop shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="accent-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1c71d8" flood-opacity="0.35" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="page-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2f2f5" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c71d8" />
      <stop offset="60%" stop-color="#3584e4" />
      <stop offset="100%" stop-color="#62a0ea" />
    </linearGradient>

    <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7800" />
      <stop offset="100%" stop-color="#e01b24" />
    </linearGradient>

    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#deddda" />
      <stop offset="100%" stop-color="#c0bfbc" />
    </linearGradient>
  </defs>

  <!-- Main Sheet / Canvas -->
  <g filter="url(#drop-shadow)">
    <!-- Base page background with folded top-right corner -->
    <path d="M 24 16
             L 82 16
             L 104 38
             L 104 112
             A 12 12 0 0 1 92 124
             L 24 124
             A 12 12 0 0 1 12 112
             L 12 28
             A 12 12 0 0 1 24 16 Z"
          fill="url(#page-bg)"
          stroke="#dfdedb"
          stroke-width="1.5" />

    <!-- Folded corner tab -->
    <path d="M 82 16
             L 82 34
             A 4 4 0 0 0 86 38
             L 104 38 Z"
          fill="url(#fold-grad)" />
    <path d="M 82 16
             L 104 38
             L 86 38
             A 4 4 0 0 1 82 34 Z"
          fill="#ffffff"
          opacity="0.6" />
  </g>

  <!-- Subtle Document Text Preview Lines -->
  <g opacity="0.45">
    <!-- Header simulation line -->
    <rect x="24" y="32" width="36" height="5" rx="2.5" fill="#1c71d8" />
    <!-- Paragraph lines -->
    <rect x="24" y="44" width="48" height="3" rx="1.5" fill="#77767b" />
    <rect x="24" y="52" width="42" height="3" rx="1.5" fill="#9a9996" />
    <rect x="24" y="60" width="34" height="3" rx="1.5" fill="#9a9996" />
  </g>

  <!-- The "Accent" Signature Mark: Bold, dynamic acute accent transforming into a pen/quill -->
  <g filter="url(#accent-shadow)">
    <!-- Stylized Acute Accent Mark (´) / Quill Blade -->
    <path d="M 40 102
             C 42 98, 48 84, 58 68
             C 68 52, 82 36, 92 28
             C 95 25, 99 26, 98 30
             C 96 36, 88 52, 76 72
             C 64 92, 52 106, 44 107
             C 41 107, 39 105, 40 102 Z"
          fill="url(#accent-grad)" />

    <!-- Ink Nib / Focus Diamond at the apex -->
    <circle cx="95" cy="27" r="4.5" fill="url(#coral-grad)" />

    <!-- Dynamic Feather Accent Line -->
    <path d="M 52 86
             Q 66 70 82 48"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.75" />
  </g>

  <!-- Markdown 'M↓' watermark in lower-right -->
  <g opacity="0.3" transform="translate(64, 88)">
    <rect x="0" y="0" width="32" height="20" rx="3" fill="#3584e4" />
    <path d="M 4 15 L 4 5 L 8 10 L 12 5 L 12 15" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 22 5 L 22 14 M 18 10 L 22 14 L 26 10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
